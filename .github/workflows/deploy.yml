name: Deploy

# Runs only after CI (test/lint/type/audit) has finished on the branches we
# deploy from, and only proceeds if CI actually passed. This is deliberately
# a separate workflow from ci.yml, not a `needs:` job in the same file — CI
# runs on every push/PR, deploy must not.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, staging]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy api service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --environment ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }} --detach

      - name: Deploy worker service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service worker --environment ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }} --detach
