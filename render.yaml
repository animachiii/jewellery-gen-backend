# Free-tier deploy path (Phase 9 alternative to railway.json).
# One free Render Web Service running both the API and the ARQ worker loop
# in-process (WORKER_IN_PROCESS=true — see app/main.py's lifespan and
# app/config.py's worker_in_process field). Render has no free Background
# Worker tier and no free Redis, so this is the shape that actually reaches
# $0: one free web service + an external free Redis (Upstash). See
# docs/deployment-free-tier.md for the tradeoffs this shape accepts.
services:
  - type: web
    name: jewellery-gen-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WORKER_IN_PROCESS
        value: "true"
      - key: ENV
        value: prod
      - key: STORAGE_BACKEND
        value: supabase
      - key: PROVIDER
        value: gemini_image
      # Generation runs on Gemini image (app/providers/gemini_image.py) --
      # no Higgsfield account/key needed for this deploy. GEMINI_IMAGE_MODEL
      # is optional (defaults to gemini-2.5-flash-image in app/config.py);
      # only set it here if overriding.
      #
      # REDIS_URL, API_KEYS, ADMIN_API_KEY, GOOGLE_SHEET_ID,
      # GOOGLE_SERVICE_ACCOUNT_JSON, GDRIVE_FOLDER_ID, SUPABASE_URL,
      # SUPABASE_SERVICE_ROLE_KEY, SUPABASE_STORAGE_BUCKET, GEMINI_API_KEY,
      # SENTRY_DSN are secrets -- set them in the Render dashboard
      # (Environment tab), never here. See docs/deployment-free-tier.md for
      # the full list and sources.
